name: Build & Release APK

# ─────────────────────────────────────────────────────────────────────────────
# 触发方式
#   1. 推送 tag（推荐）：push 一个 v* 标签 → 自动构建 + 把 APK 挂到同名 Release
#   2. 手动运行：Actions 页 → Run workflow → 只构建并把 APK 存为构建产物（不发 Release）
#
# 需要配置的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   REPRO_KEYSTORE_BASE64  密钥库文件的 base64（生成见 README/发布说明）
#   REPRO_STORE_PASSWORD   密钥库密码
#   REPRO_KEY_ALIAS        密钥别名
#   REPRO_KEY_PASSWORD     密钥密码
#
#   ⚠️ 四个都配好才会出**已签名**包；缺任意一个则构建未签名包（流水线不会失败）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 挂 Release 资产需要 write 权限
permissions:
  contents: write

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装 Android SDK Platform android-37.0 与 build-tools 37.0.0，
      # 正好满足本工程 compileSdk 37 + compileSdkMinor 0，无需额外安装。
      - name: 打印构建环境
        run: |
          echo "Gradle: $(./gradlew --version | grep -E '^Gradle' || true)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
          echo "build-tools 目录："; ls "$ANDROID_HOME/build-tools" 2>&1 | sed 's/^/  /'

      - name: 拉取构建依赖（sherpa-onnx AAR，约 50 MB）
        run: bash tools/fetch_deps.sh

      # ★ 诊断：把四项签名 Secret 的**存在性**（不打印值）与密钥库解码结果写进步骤摘要，
      #   这样「未签名闸门」触发时不用翻日志就能看出到底缺哪一个。
      # ★ Secrets 不会自动成为环境变量，必须显式导出，否则 check_secrets 的
      #   间接展开 ${!s} 读到的永远是空 —— 诊断会误报「全部未配置」。
      - name: 载入签名密钥库
        env:
          REPRO_KEYSTORE_BASE64: ${{ secrets.REPRO_KEYSTORE_BASE64 }}
          REPRO_STORE_PASSWORD: ${{ secrets.REPRO_STORE_PASSWORD }}
          REPRO_KEY_ALIAS: ${{ secrets.REPRO_KEY_ALIAS }}
          REPRO_KEY_PASSWORD: ${{ secrets.REPRO_KEY_PASSWORD }}
        run: |
          check_secrets() {
            {
              echo "### 签名 Secret 检查"
              echo ""
              echo "| Secret | 状态 |"
              echo "|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            local miss=0
            for s in "$@"; do
              if [ -n "${!s}" ]; then
                echo "| \`$s\` | 已配置 |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| \`$s\` | **未配置** |" >> "$GITHUB_STEP_SUMMARY"
                miss=1
              fi
            done
            return $miss
          }

          if [ -z "${REPRO_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::REPRO_KEYSTORE_BASE64 未配置 —— 本次构建将产出**未签名**包，tag 构建会被闸门拦下"
          else
            if printf '%s' "$REPRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/retropro-release.p12"; then
              echo "REPRO_STORE_FILE=$RUNNER_TEMP/retropro-release.p12" >> "$GITHUB_ENV"
              echo "- 密钥库已解码，将产出已签名包" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::REPRO_KEYSTORE_BASE64 解码失败 —— 内容可能损坏或含多余换行，请重新生成完整 base64"
              exit 1
            fi
          fi
          check_secrets REPRO_STORE_PASSWORD REPRO_KEY_ALIAS REPRO_KEY_PASSWORD || true

      - name: 构建 release
        env:
          REPRO_STORE_PASSWORD: ${{ secrets.REPRO_STORE_PASSWORD }}
          REPRO_KEY_ALIAS: ${{ secrets.REPRO_KEY_ALIAS }}
          REPRO_KEY_PASSWORD: ${{ secrets.REPRO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 打印产物并校验签名
        run: |
          ls -lh app/build/outputs/apk/release/ | tee -a "$GITHUB_STEP_SUMMARY"
          # ★ 必须显式挑 apksigner 三签的产物，不能靠 ls 顺序：
          #   目录里同时有 app-release.apk（AGP 打包器在 minSdk 高时**只写 v3**）和
          #   RetroPro-<ver>-signed.apk（apksigner 显式签的 v1+v2+v3）。
          #   locale 排序下会被 app-release.apk 抢到第一位，
          #   而 verify --min-sdk-version 23 会强求 v1+v2 → 必然失败。
          APK=$(ls app/build/outputs/apk/release/RetroPro-*-signed.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/release/*-signed.apk 2>/dev/null | head -1)
          fi
          echo "待校验产物：$APK"
          {
            echo "### 产物校验"
            echo ""
            echo "- 待校验：`${APK:-（未找到任何 APK）}`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$APK" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/retropro-release.p12" ]; then
            if [ ! -z "$APK" ]; then
              set +e
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --min-sdk-version 23 "$APK"
              RC=$?
              set -e
              echo "apksigner verify 退出码：$RC" >> "$GITHUB_STEP_SUMMARY"
              if [ $RC -ne 0 ]; then
                echo "::error::apksigner verify 对 $APK 失败（退出码 $RC）—— 见上方输出确认缺哪档签名块"
                exit 1
              fi
              echo "✓ v1+v2+v3 三签校验通过" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # 失败时把现场写回仓库（无 token 时读不到日志/summary，只能让 CI 自己交代）。
      # push 到 main 不会触发本 workflow（它只认 tags），故不会自激循环。
      - name: 失败时落盘产物诊断
        if: failure()
        run: |
          {
            echo "=== 运行上下文 ==="
            echo "workflow=${GITHUB_WORKFLOW} run=${GITHUB_RUN_ID} ref=${GITHUB_REF}"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "RUNNER_OS=$RUNNER_OS"
            echo "=== build-tools 目录 ==="
            ls "$ANDROID_HOME/build-tools" 2>&1
            echo "=== apksigner 实际位置 ==="
            command -v apksigner 2>&1 || true
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -3
            echo "=== 产物目录 ==="
            ls -1 app/build/outputs/apk/release/ 2>&1
            echo "=== 各 APK 的签名档位（v1/v2/v3，按 --min-sdk-version 23 的口径）==="
            for a in app/build/outputs/apk/release/*.apk; do
              [ -e "$a" ] || continue
              echo "--- $a"
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --min-sdk-version 23 "$a" 2>&1 \
                | grep -E "Verified using|Verifies|DOES NOT VERIFY|Exception|error" | head -6
              echo "   退出码 ${PIPESTATUS[0]}"
            done
          } > ci-diag.txt
          git config user.email "ci@actions"
          git config user.name "github-actions"
          git add ci-diag.txt
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -q -m "ci(diag): 产物诊断（自动，可删）"
            git push origin HEAD:main
          fi

      - name: 存为构建产物
        uses: actions/upload-artifact@v7
        with:
          name: retropro-apk
          path: app/build/outputs/apk/release/*.apk

      # ★ 硬闸门：tag 构建必须产出**已签名**包，否则直接失败。
      #
      # 血泪教训：签名 Secret 未配置时 AGP 会产出 `app-release-unsigned.apk`，
      # 而 Release 步骤原来的 glob `*.apk` 会把它一起发出去 —— 用户下到的包根本装不上。
      # 宁可让流水线红，也不要往公开 Release 里塞一个装不上的包。
      - name: 校验产物已签名（未签名则拒绝发版）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # ★ 只认 signReleaseV123 显式三签的产物 RetroPro-<ver>-signed.apk。
          #   目录里还有 AGP 单签（minSdk 高时 build 器只写 v3）的 app-release.apk，
          #   把 glob 放宽成 *-signed.apk 会把那个包误判成"签名通过"（假阳性）。
          SIGNED=$(ls app/build/outputs/apk/release/RetroPro-*-signed.apk 2>/dev/null | head -1 || true)
          if [ -z "$SIGNED" ]; then
            SIGNED=$(ls app/build/outputs/apk/release/*-signed.apk 2>/dev/null | head -1 || true)
          fi
          {
            echo "### 产物清单"
            echo ""
            ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null > /tmp/apks.txt
            if [ -s /tmp/apks.txt ]; then
              sed 's/^/`/; s/$/`/' /tmp/apks.txt
            else
              echo "（输出目录里没有 APK）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SIGNED" ]; then
            {
              echo ""
              echo "### 闸门拦截"
              echo ""
              echo "未找到 \`*-signed.apk\` —— 构建产物是未签名包，拒绝发布。"
              echo ""
              echo "**成因有两个，按出现概率排序**："
              echo ""
              echo "1. 四项签名 Secret 未配齐 → \`useSigning\` 为 false → AGP 产出 \`-unsigned\` 包。"
              echo "   看上面「签名 Secret 检查」表里标 **未配置** 的那一项，补上即可。"
              echo "2. \`signReleaseV123\` 未注册 → 它要求 \`sdkDir != null\`（来自 ANDROID_HOME 或 local.properties）。"
              echo "   跑一次「打印构建环境」步骤，确认 \`ANDROID_HOME\` 有值、build-tools 目录里存在 \`37.0.0\`。"
              echo ""
              echo "Secret 名必须严格一致（大小写敏感）。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::没有找到已签名 APK —— 签名 Secret 未配齐（详见本步骤摘要），拒绝发布未签名包。"
            exit 1
          fi
          echo "已签名产物：$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: 发布到 Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          # 只发已签名包：glob 收窄为 *-signed.apk，未签名包永远进不了 Release
          files: app/build/outputs/apk/release/*-signed.apk
          generate_release_notes: true
          draft: false

      # ---------------------------------------------------------------------
      # 同步 APK 到 AtomGit（实际托管在 GitCode，故走 api.gitcode.com）
      #
      # 接口取自 GitCode 官方文档（逐条核对，非猜测）：
      #   ① 建版本   POST /api/v5/repos/{owner}/{repo}/releases         {tag_name,name,body}
      #   ② 取上传址 GET  .../releases/{tag}/upload_url?file_name=xxx  → {url, headers}
      #   ③ 上传     PUT  <上一步返回的 url>，带上返回的 headers
      #   ④ 回读     GET  .../releases/tags/{tag}                      → assets[].browser_download_url
      #
      # ⚠️ 这些接口**必须**带访问令牌（SSH 密钥只能推代码，不能发版）：
      #   在 https://gitcode.com/setting/token-classic 生成，存为仓库 Secret `ATOMGIT_TOKEN`。
      #   未配置时本步骤自动跳过（不会让流水线变红）。
      # ---------------------------------------------------------------------
      - name: 同步 APK 到 AtomGit / GitCode Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # 兼容两种 Secret 命名：规范名 ATOMGIT_TOKEN，或历史遗留的 RELEASE
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.RELEASE }}
          ATOMGIT_REPO: zeyueryu/RetroPro
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${ATOMGIT_TOKEN:-}" ]; then
            echo "::notice::未配置 ATOMGIT_TOKEN，跳过 AtomGit 同步（代码仍会随 git push 同步）"
            exit 0
          fi

          APK=$(ls app/build/outputs/apk/release/*-signed.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "待上传：$APK（$TAG）"

          # ① 建版本（已存在会返回非 201，不视为失败）
          CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"RetroPro ${TAG}\",\"body\":\"详见 GitHub Release 的说明\"}")
          echo "建版本 → HTTP $CODE"

          # ② 取预签名上传地址
          curl -sS -o /tmp/upload.json --fail \
            "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases/${TAG}/upload_url?file_name=$(basename "$APK")" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}"

          # ③ 上传（预签名 URL 要求 PUT + 返回的 headers）
          python3 - <<'PY'
          import json, os, urllib.request
          spec = json.load(open('/tmp/upload.json'))
          apk = os.environ['APK']
          data = open(apk, 'rb').read()
          req = urllib.request.Request(spec['url'], data=data, method='PUT')
          for k, v in (spec.get('headers') or {}).items():
              req.add_header(k, v)
          with urllib.request.urlopen(req, timeout=900) as r:
              print('上传 →', r.status, f'({len(data)/1048576:.1f} MiB)')
          PY

          # ④ 回读附件直链（供 App 内「AtomGit 下载」按钮使用）
          curl -sS "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases/tags/${TAG}" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}" > /tmp/release.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/release.json'))
          print('Release:', d.get('name'), '| tag:', d.get('tag_name'))
          for a in d.get('assets') or []:
              print('  附件直链:', a.get('name'), '→', a.get('browser_download_url'))
          PY
