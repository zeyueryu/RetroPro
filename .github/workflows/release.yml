name: Build & Release APK

# ─────────────────────────────────────────────────────────────────────────────
# 触发方式
#   1. 推送 tag（推荐）：push 一个 v* 标签 → 自动构建 + 把 APK 挂到同名 Release
#   2. 手动运行：Actions 页 → Run workflow → 只构建并把 APK 存为构建产物（不发 Release）
#
# 需要配置的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   REPRO_KEYSTORE_BASE64  密钥库文件的 base64（生成见 README/发布说明）
#   REPRO_STORE_PASSWORD   密钥库密码
#   REPRO_KEY_ALIAS        密钥别名
#   REPRO_KEY_PASSWORD     密钥密码
#
#   ⚠️ 四个都配好才会出**已签名**包；缺任意一个则构建未签名包（流水线不会失败）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 挂 Release 资产需要 write 权限
permissions:
  contents: write

jobs:
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装 Android SDK Platform android-37.0 与 build-tools 37.0.0，
      # 正好满足本工程 compileSdk 37 + compileSdkMinor 0，无需额外安装。
      - name: 打印构建环境
        run: |
          echo "Gradle: $(./gradlew --version | grep -E '^Gradle' || true)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: 拉取构建依赖（sherpa-onnx AAR，约 50 MB）
        run: bash tools/fetch_deps.sh

      - name: 载入签名密钥库
        run: |
          if [ -n "${{ secrets.REPRO_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.REPRO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/retropro-release.p12"
            echo "REPRO_STORE_FILE=$RUNNER_TEMP/retropro-release.p12" >> "$GITHUB_ENV"
            echo "::notice::已载入签名密钥库，将产出已签名包"
          else
            echo "::warning::未配置 REPRO_KEYSTORE_BASE64，本次构建为未签名包"
          fi

      - name: 构建 release
        env:
          REPRO_STORE_PASSWORD: ${{ secrets.REPRO_STORE_PASSWORD }}
          REPRO_KEY_ALIAS: ${{ secrets.REPRO_KEY_ALIAS }}
          REPRO_KEY_PASSWORD: ${{ secrets.REPRO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 打印产物并校验签名
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/retropro-release.p12" ]; then
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --min-sdk-version 23 "$APK"
          fi

      - name: 存为构建产物
        uses: actions/upload-artifact@v7
        with:
          name: retropro-apk
          path: app/build/outputs/apk/release/*.apk

      # ★ 硬闸门：tag 构建必须产出**已签名**包，否则直接失败。
      #
      # 血泪教训：签名 Secret 未配置时 AGP 会产出 `app-release-unsigned.apk`，
      # 而 Release 步骤原来的 glob `*.apk` 会把它一起发出去 —— 用户下到的包根本装不上。
      # 宁可让流水线红，也不要往公开 Release 里塞一个装不上的包。
      - name: 校验产物已签名（未签名则拒绝发版）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SIGNED=$(ls app/build/outputs/apk/release/*-signed.apk 2>/dev/null | head -1 || true)
          if [ -z "$SIGNED" ]; then
            echo "::error::没有找到已签名 APK —— 说明签名 Secret 未配置，拒绝发布未签名包。"
            echo "::error::请先在 Settings → Secrets and variables → Actions 配置 REPRO_KEYSTORE_BASE64 / REPRO_STORE_PASSWORD / REPRO_KEY_ALIAS / REPRO_KEY_PASSWORD 四个 Secret。"
            exit 1
          fi
          echo "已签名产物：$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: 发布到 Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          # 只发已签名包：glob 收窄为 *-signed.apk，未签名包永远进不了 Release
          files: app/build/outputs/apk/release/*-signed.apk
          generate_release_notes: true
          draft: false

      # ---------------------------------------------------------------------
      # 同步 APK 到 AtomGit（实际托管在 GitCode，故走 api.gitcode.com）
      #
      # 接口取自 GitCode 官方文档（逐条核对，非猜测）：
      #   ① 建版本   POST /api/v5/repos/{owner}/{repo}/releases         {tag_name,name,body}
      #   ② 取上传址 GET  .../releases/{tag}/upload_url?file_name=xxx  → {url, headers}
      #   ③ 上传     PUT  <上一步返回的 url>，带上返回的 headers
      #   ④ 回读     GET  .../releases/tags/{tag}                      → assets[].browser_download_url
      #
      # ⚠️ 这些接口**必须**带访问令牌（SSH 密钥只能推代码，不能发版）：
      #   在 https://gitcode.com/setting/token-classic 生成，存为仓库 Secret `ATOMGIT_TOKEN`。
      #   未配置时本步骤自动跳过（不会让流水线变红）。
      # ---------------------------------------------------------------------
      - name: 同步 APK 到 AtomGit / GitCode Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # 兼容两种 Secret 命名：规范名 ATOMGIT_TOKEN，或历史遗留的 RELEASE
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN || secrets.RELEASE }}
          ATOMGIT_REPO: zeyueryu/RetroPro
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${ATOMGIT_TOKEN:-}" ]; then
            echo "::notice::未配置 ATOMGIT_TOKEN，跳过 AtomGit 同步（代码仍会随 git push 同步）"
            exit 0
          fi

          APK=$(ls app/build/outputs/apk/release/*-signed.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "待上传：$APK（$TAG）"

          # ① 建版本（已存在会返回非 201，不视为失败）
          CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"RetroPro ${TAG}\",\"body\":\"详见 GitHub Release 的说明\"}")
          echo "建版本 → HTTP $CODE"

          # ② 取预签名上传地址
          curl -sS -o /tmp/upload.json --fail \
            "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases/${TAG}/upload_url?file_name=$(basename "$APK")" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}"

          # ③ 上传（预签名 URL 要求 PUT + 返回的 headers）
          python3 - <<'PY'
          import json, os, urllib.request
          spec = json.load(open('/tmp/upload.json'))
          apk = os.environ['APK']
          data = open(apk, 'rb').read()
          req = urllib.request.Request(spec['url'], data=data, method='PUT')
          for k, v in (spec.get('headers') or {}).items():
              req.add_header(k, v)
          with urllib.request.urlopen(req, timeout=900) as r:
              print('上传 →', r.status, f'({len(data)/1048576:.1f} MiB)')
          PY

          # ④ 回读附件直链（供 App 内「AtomGit 下载」按钮使用）
          curl -sS "https://api.gitcode.com/api/v5/repos/${ATOMGIT_REPO}/releases/tags/${TAG}" \
            -H "Authorization: Bearer ${ATOMGIT_TOKEN}" > /tmp/release.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/release.json'))
          print('Release:', d.get('name'), '| tag:', d.get('tag_name'))
          for a in d.get('assets') or []:
              print('  附件直链:', a.get('name'), '→', a.get('browser_download_url'))
          PY
