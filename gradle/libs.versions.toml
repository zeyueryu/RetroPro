[versions]
# Compose 1.12.x / core-ktx 1.19 等依赖要求 AGP >= 9.1.0
# 依赖要求 compileSdk >= 37，而 compileSdk 37 需要 AGP 9.4+（对应 Gradle 9.6+）
agp = "9.4.1"
kotlin = "2.4.20"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
# 必须与 MIUIX 0.9.4 锚定的 org.jetbrains.compose.foundation:1.12.0 对齐
compose = "1.12.1"

# MIUIX —— Xiaomi HyperOS 设计语言（Apache-2.0）
miuix = "0.9.4"
# Haze —— 液态玻璃主力材质（Apache-2.0）
haze = "2.0.0"
# Kyant0 Backdrop —— 液态玻璃折射增强（Apache-2.0）
backdrop = "2.0.1"

# KSP —— 已改为独立版本号（不再跟 Kotlin 版本走前后缀）
ksp = "2.3.12"
# Room —— 本地数据库
room = "2.8.5"
# Lifecycle / ViewModel —— 计分板横竖屏切换时不丢状态
lifecycle = "2.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }

miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
# miuix-blur-android 声明 minSdk 33 → 为支持 Android 12 已移除（代码中从未使用）
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle-android", version.ref = "miuix" }

haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# Glass（折射）是独立模块，不在 haze-blur 内
haze-glass = { module = "dev.chrisbanes.haze:haze-glass", version.ref = "haze" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }

# ---- Room 本地数据库 ----
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# ---- 协程（Room 的 Flow 支持需要） ----
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }

# ---- Lifecycle / ViewModel ----
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
